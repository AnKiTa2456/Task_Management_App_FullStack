services:
  - type: web
    name: task-management-app-fullstack
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run prisma:generate && npm run prisma:deploy && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://task-management-app-full-stack-9zgondblz.vercel.app,https://task-management-app-full-stack.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
